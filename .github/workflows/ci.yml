name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    - name: Run linting
      run: |
        flake8 . --max-line-length=120 --extend-ignore=E203
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=smart_rename_pro --cov-report=xml
    - name: Run GUI tests
      if: runner.os == 'Linux'  # GUI tests only on Linux
      run: |
        pytest tests/ --qt-api=pyqt6
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        flags: unittests
        name: codecov-umbrella
        verbose: true

  build-exe:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build executable
      run: |
        pyinstaller --onefile --name smart-rename smart_rename_pro.py
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: smart-rename-exe
        path: dist/smart-rename.exe
    - name: Release executable
      uses: softprops/action-gh-release@v2
      with:
        files: dist/smart-rename.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
