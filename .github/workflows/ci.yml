name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run linting
      run: |
        flake8 . --max-line-length=120 --extend-ignore=E203
    - name: Run tests with coverage
      run: |
        pytest tests/ --cov=smart_rename_pro --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        fail_ci_if_error: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-exe:
    runs-on: windows-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build executable
      run: |
        pyinstaller --onefile --name smart-rename smart_rename_pro.py
    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: smart-rename-exe
        path: dist/smart-rename.exe
    - name: Release executable
      uses: softprops/action-gh-release@v2
      with:
        files: dist/smart-rename.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
